inbox: D:\Main\OpenCode\Projekt_AI_Base\inbox
ollama:
  endpoint: http://localhost:11434
  model: deepseek-r1:14b
  prompt: 'Ты анализируешь переписку пользователя с AI-ассистентом.


    Выполни два действия:

    1. Напиши краткое саммари (1-2 предложения) — о чём чат, какие вопросы задавал
    пользователь, что обсуждали. Будь конкретным.

    2. Предложи 3-5 тегов (ключевых слов), отражающих тематику и контекст разговора.


    Ответ формулируй на русском языке. Названия технологий, библиотек, языков программирования
    и продуктов оставляй в оригинальном написании (английском).


    Формат ответа строго:


    SUMMARY:

    <саммари>


    TAGS:

    тег1, тег2, тег3


    Переписка:

    ---

    {content}

    ---'
  options:
    temperature: 0.2
    num_ctx: 8192
outbox: D:\Main\NextMain\PROJECT\ОБСИДИАН\Блокнот\AI-Chats
server:
  port: 18888
services:
  deepseek.com: deepseek
  gemini.google.com: gemini
  glm5.ai: glm5
  qwen.ai: qwen
timeout:
  ollama: 180
ui:
  log_font_size: 14
  zoom: 164
config_version: 2
